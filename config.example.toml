database = "data/bridge.db"
debug = false
# Optional Prometheus endpoint at /metrics. Disabled when omitted.
# Use 0.0.0.0:9090 for container scraping; restrict access at the network level.
metrics_listen = "127.0.0.1:9090"

[matrix]
homeserver = "https://matrix.example.org"
data_dir = "data/matrix"
store_passphrase = "another secret"
# First login: open the link the bridge prints, log in, paste the address
# the browser ends up on here and restart within 2 minutes.
# bootstrap_link = "http://localhost/?loginToken=..."

[irc.libera]
server = "irc.libera.chat"
port = 6697
tls = true
nickname = "examplebridge"
nick_password = "nickserv secret"

[irc.oftc]
server = "irc.oftc.net"
nickname = "examplebridge"

[[bridge]]
name = "rust"
matrix = "!abcdefghijklmnop:example.org"
irc = { network = "libera", channel = "#rust" }

[[bridge]]
name = "rust-oftc"
matrix = "!qrstuvwxyz:example.org"
irc = { network = "oftc", channel = "#rust" }

[[bridge]]
name = "offtopic"
matrix = "!another:example.org"
irc = { network = "libera", channel = "#offtopic" }
